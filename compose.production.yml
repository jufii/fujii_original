services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 10s
      retries: 8
    restart: unless-stopped
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--workers", "2"]
    environment:
      APP_ENV: production
      SEED_DEMO: "false"
      DATABASE_URL: postgresql+psycopg://football:${POSTGRES_PASSWORD}@db:5432/football
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    environment:
      APP_ENV: production
      SEED_DEMO: "false"
      DATABASE_URL: postgresql+psycopg://football:${POSTGRES_PASSWORD}@db:5432/football
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "${HTTP_BIND:-127.0.0.1}:8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  pgdata:
